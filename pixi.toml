[workspace]
channels = ["conda-forge"]
name = "ai-notebooks"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
ray-tune = ">=2.53.0,<3"
numpy = ">=2.4.2,<3"
pytorch-cpu = ">=2.10.0,<3"
torchvision = ">=0.25.0,<0.26"
torchaudio = ">=2.10.0,<3"
wandb = ">=0.24.1,<0.25"
dask = ">=2026.1.2,<2027"
matplotlib = ">=3.10.8,<4"
huggingface_hub = ">=1.3.7,<2"
fsspec = ">=2026.1.0,<2027"
pyarrow = ">=23.0.0,<24"
graphviz = ">=14.1.2,<15"
gdown = ">=5.2.1,<6"
ray-default = ">=2.53.0,<3"
sentencepiece = ">=0.2.1,<0.3"

[system-requirements]
libc = { version = "2.42" }

[pypi-dependencies]
torch-xla = { version = ">=2.9.0, <3", extras = ["tpu"] }
