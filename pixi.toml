[workspace]
channels = ["conda-forge"]
name = "ai-notebooks"
version = "0.1.0"
exclude-newer = "0d"
platforms = [{platform = "linux-64", glibc = "2.42"}, "linux-64"]

[dependencies]
ray-tune = ">=2.59.0,<3"
numpy = ">=2.5.4,<3"
pytorch-cpu = ">=2.13.0,<3"
torchvision = ">=0.28.0,<0.29"
torchaudio = ">=2.11.0,<3"
wandb = ">=0.30.0,<0.31"
dask = ">=2026.8.0,<2027"
matplotlib = ">=3.11.2,<4"
huggingface_hub = ">=1.16.1,<2"
fsspec = ">=2026.9.0,<2027"
pyarrow = ">=25.0.0,<26"
graphviz = ">=14.1.2,<15"
gdown = ">=6.4.2,<7"
ray-default = ">=2.59.0,<3"
sentencepiece = ">=0.2.1,<0.3"
transformers = ">=5.17.0,<6"
bitsandbytes = ">=0.50.2,<0.51"
faiss-gpu = ">=1.14.3,<2"
python = ">=3.14.8,<3.15"
clang = ">=23.1.3,<24"
clang-tools = ">=23.1.3,<24"
lldb = ">=22.1.8,<23"
libarrow-all = ">=25.0.0,<26"
cmake = ">=4.4.4,<5"
ninja = ">=1.13.2,<2"
libflac = ">=1.5.0,<2"
nanobind = ">=3.1.0,<4"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]

[tasks]
config = "cmake -S ./wave_renderer -B ./wave_renderer/build -GNinja $CMAKE_ARGS -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
build = { cmd = "cmake --build ./wave_renderer/build -j", depends-on = ["config"] }
exec = { cmd = "python -m wave_renderer.main" }


[target.linux-64.dependencies]
clang_linux-64 = ">=23.1,<24"
clangxx_linux-64 = ">=23.1,<24"
